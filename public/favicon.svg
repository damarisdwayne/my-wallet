<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="#09090b"/>

  <!-- Glow behind line -->
  <path d="M 88 360 L 200 232 L 304 284 L 424 128"
        fill="none"
        stroke="#22c55e"
        stroke-width="52"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.15"/>

  <!-- Chart line -->
  <path d="M 88 360 L 200 232 L 304 284 L 424 128"
        fill="none"
        stroke="url(#grad)"
        stroke-width="32"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Dots -->
  <circle cx="88"  cy="360" r="18" fill="#166534"/>
  <circle cx="200" cy="232" r="18" fill="#16a34a"/>
  <circle cx="304" cy="284" r="18" fill="#16a34a"/>

  <!-- End dot (bright) -->
  <circle cx="424" cy="128" r="24" fill="#22c55e"/>
  <circle cx="424" cy="128" r="14" fill="white"/>

  <!-- Gradient definition -->
  <defs>
    <linearGradient id="grad" x1="88" y1="360" x2="424" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#166534"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
</svg>
