<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fundo cheio (sem rx — o OS recorta no formato que quiser) -->
  <rect width="512" height="512" fill="#09090b"/>

  <!-- Glow -->
  <path d="M 108 372 L 208 252 L 304 296 L 404 148"
        fill="none"
        stroke="#22c55e"
        stroke-width="56"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.15"/>

  <!-- Chart line -->
  <path d="M 108 372 L 208 252 L 304 296 L 404 148"
        fill="none"
        stroke="url(#g)"
        stroke-width="32"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Dots -->
  <circle cx="108" cy="372" r="18" fill="#166534"/>
  <circle cx="208" cy="252" r="18" fill="#16a34a"/>
  <circle cx="304" cy="296" r="18" fill="#16a34a"/>

  <!-- End dot -->
  <circle cx="404" cy="148" r="24" fill="#22c55e"/>
  <circle cx="404" cy="148" r="14" fill="white"/>

  <defs>
    <linearGradient id="g" x1="108" y1="372" x2="404" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#166534"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
</svg>
